<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JIANMO 挂件预览</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111210; overflow: hidden; }
      canvas { display: block; }
      #hint {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        font: 12px/1.6 "Noto Sans SC", system-ui, sans-serif;
        color: rgba(236, 231, 219, .45); letter-spacing: .04em;
        pointer-events: none; user-select: none;
      }
      #label {
        position: fixed; top: 16px; left: 18px;
        font: 13px/1.5 "Noto Sans SC", system-ui, sans-serif;
        color: rgba(236, 231, 219, .78);
        pointer-events: none; user-select: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="label"></div>
    <div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      const params = new URLSearchParams(location.search);
      const model = params.get('model') || 'ikuyo-kita-charm.glb';
      const label = params.get('label') || '';
      const path = params.get('path') || '/public/models/charms/';
      const size = Number(params.get('size') || 1000);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(2);
      renderer.setSize(size, size);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#111210');

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
      camera.position.set(0, 0.35, 3.0);

      const key = new THREE.DirectionalLight(0xffffff, 2.0);
      key.position.set(2.5, 4, 3);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xdfe6ff, 1.1);
      rim.position.set(-3, 1.2, -2.5);
      scene.add(rim);
      scene.add(new THREE.AmbientLight(0xffffff, 0.42));

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 0.6;
      controls.maxDistance = 8;
      controls.target.set(0, 0, 0);

      const loader = new GLTFLoader();

      loader.load(path + model, (gltf) => {
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const boxSize = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        root.position.sub(center);

        const holder = new THREE.Group();
        holder.add(root);
        const longest = Math.max(boxSize.x, boxSize.y, boxSize.z) || 1;
        holder.scale.setScalar(2.1 / longest);
        scene.add(holder);

        // the cord the charm hangs from -- a thin line out of the top of
        // the frame, so the piece reads as a keychain rather than a figurine
        const top = boxSize.y * 0.5;
        const cord = new THREE.Mesh(
          new THREE.CylinderGeometry(boxSize.y * 0.012, boxSize.y * 0.012,
                                    boxSize.y * 1.6, 12),
          new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.85 }),
        );
        cord.position.set(0, top + boxSize.y * 0.8, 0);
        holder.add(cord);

        if (label) document.getElementById('label').textContent = label;
        window.modelReady = true;
        window.render();
      }, undefined, (err) => {
        window.modelError = String(err);
        console.error(err);
      });

      window.render = () => renderer.render(scene, camera);

      // the capture harness drives the camera with distances tuned for the
      // standing characters; a charm is much smaller, so everything is scaled
      window.setView = (azDeg, elDeg, dist, targetY) => {
        const az = (azDeg * Math.PI) / 180;
        const el = (elDeg * Math.PI) / 180;
        const ty = (targetY || 0) * 0.76;
        const d = dist * 0.76;
        camera.position.set(
          Math.sin(az) * Math.cos(el) * d,
          Math.sin(el) * d + ty,
          Math.cos(az) * Math.cos(el) * d,
        );
        controls.target.set(0, ty, 0);
        camera.lookAt(0, ty, 0);
        renderer.render(scene, camera);
      };

      window.setView(0, 4, 2.6, 0);
    </script>
  </body>
</html>
